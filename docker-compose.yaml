services:
  airflow-init:
    build: .
    env_file:
      - ./.env
    container_name: airflow_init_service
    environment:
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow_tech:airflow_pass@host.docker.internal:5432/airflow_db
    entrypoint: /bin/bash
    command:
      - -c
      - |
        # Устанавливаем права на папки, чтобы пользователь airflow мог в них писать
        mkdir -p /sources/logs /sources/dags /sources/plugins
        chown -R "${AIRFLOW_UID:-50000}:0" /sources/{logs,dags,plugins}
        # Запускаем стандартный entrypoint для выполнения миграций и создания пользователя
        exec /entrypoint airflow version
    user: "0:0"
    networks:
      - data_platform_net
    volumes:
      - .:/sources
    extra_hosts:
      - "host.docker.internal:host-gateway"
  airflow-webserver:
    build: .
    restart: always
    container_name: airflow_webserver_service
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow_tech:airflow_pass@host.docker.internal:5432/airflow_db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__TEST_CONNECTION=Enabled
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW__CORE__FERNET_KEY}
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW__WEBSERVER__SECRET_KEY}
    env_file:
      - ./.env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    ports:
      - "8080:8080"
    networks:
      - data_platform_net
    user: "${AIRFLOW_UID:-50000}:0"
    command: webserver
    healthcheck:
      test: ["CMD-SHELL", "[ -f /usr/local/airflow/airflow-webserver.pid ]"]
      interval: 30s
      timeout: 30s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    
  airflow-scheduler:
    build: .
    restart: always
    container_name: airflow_scheduler_service
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow_tech:airflow_pass@host.docker.internal:5432/airflow_db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__TEST_CONNECTION=Enabled
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW__CORE__FERNET_KEY}
    env_file:
      - ./.env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    user: "${AIRFLOW_UID:-50000}:0"
    command: scheduler
    networks:
      - data_platform_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      airflow-webserver:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    build: .
    restart: always
    container_name: airflow_triggerer_service
    env_file:
      - ./.env
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow_tech:airflow_pass@host.docker.internal:5432/airflow_db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW__CORE__FERNET_KEY}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    user: "${AIRFLOW_UID:-50000}:0"
    command: triggerer
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "TriggererJob", "--local"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - data_platform_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

networks:
  data_platform_net:
    name: data_platform_net
